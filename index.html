<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6efd">
<link rel="manifest" href="./manifest.json">
<title>オピオイド換算</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: #f3f5f7;
  color: #222;
}

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 18px 14px 30px;
}

h1 {
  font-size: 24px;
  text-align: center;
  margin: 8px 0 22px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  margin-bottom: 14px;
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 7px;
}

select,
input,
button {
  width: 100%;
  font-size: 18px;
  min-height: 50px;
  border-radius: 10px;
}

select,
input {
  border: 1px solid #bbb;
  padding: 8px 12px;
  background: #fff;
}

.field {
  margin-bottom: 16px;
}

.field:last-child {
  margin-bottom: 0;
}

.arrow {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  margin: 4px 0 14px;
}

button {
  border: 0;
  background: #0b6efd;
  color: #fff;
  font-weight: 700;
  margin-top: 4px;
}

button:active {
  transform: scale(.99);
}

.result-card {
  text-align: center;
}

.result-label {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
}

.result-drug {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 10px;
}

.result-value {
  font-size: 34px;
  font-weight: 700;
  margin: 8px 0 4px;
}

.result-note {
  font-size: 13px;
  color: #666;
  margin-top: 12px;
}

/* 相談コメント */
.consult-note {
  margin-top: 16px;
  padding: 12px;
  border: 2px solid #d32f2f;
  border-radius: 10px;
  background: #fff5f5;
  color: #c62828;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.6;
  text-align: left;
}

/* すべての結果に表示する注意コメント */
.result-warning {
  margin-top: 14px;
  padding: 12px;
  border: 2px solid #d32f2f;
  border-radius: 10px;
  background: #fff5f5;
  color: #c62828;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.7;
  text-align: left;
}

.error {
  color: #c62828;
  font-weight: 700;
  text-align: center;
  font-size: 15px;
  margin-top: 12px;
}

@media (max-width: 520px) {
  main {
    padding: 12px 10px 24px;
  }

  h1 {
    font-size: 21px;
  }

  .card {
    padding: 14px;
  }

  .result-value {
    font-size: 30px;
  }

  .consult-note {
    font-size: 14px;
  }

  .result-warning {
    font-size: 14px;
  }
}
</style>

</head>

<body>

<main>

<h1>オピオイド換算</h1>

<section class="card">

  <div class="field">

<label for="fromDrug">変更前の薬剤</label>

<select id="fromDrug">

  <option value="モルヒネ内服 mg">
    モルヒネ内服 mg
  </option>

  <option value="ヒドロモルフォン内服 mg">
    ヒドロモルフォン内服 mg
  </option>

  <option value="オキシコドン内服 mg">
    オキシコドン内服 mg
  </option>

  <option value="フェンタニル貼付剤（1日用） mg">
    フェンタニル貼付剤（1日用） mg
  </option>

  <option value="モルヒネ坐剤 mg">
    モルヒネ坐剤 mg
  </option>

  <option value="モルヒネ注射 mg">
    モルヒネ注射 mg
  </option>

  <option value="ヒドロモルフォン注射 mg">
    ヒドロモルフォン注射 mg
  </option>

  <option value="オキシコドン注射 mg">
    オキシコドン注射 mg
  </option>

  <option value="フェンタニル注射 μg">
    フェンタニル注射 μg
  </option>

  <option value="トラマドール内服 mg">
    トラマドール内服 mg
  </option>

  <option value="デュロテップパッチ（3日用） mg">
    デュロテップパッチ（3日用） mg
  </option>

</select>

  </div>

  <div class="field">

<label for="amount">変更前の量</label>

<input
  id="amount"
  type="number"
  inputmode="decimal"
  step="any"
  min="0"
  value="0"
>

  </div>

  <div class="arrow">
    ↓
  </div>

  <div class="field">

```
<label for="toDrug">変更後の薬剤</label>

<select id="toDrug">

  <option value="モルヒネ内服 mg">
    モルヒネ内服 mg
  </option>

  <option value="ヒドロモルフォン内服 mg">
    ヒドロモルフォン内服 mg
  </option>

  <option value="オキシコドン内服 mg">
    オキシコドン内服 mg
  </option>

  <option value="フェンタニル貼付剤（1日用） mg">
    フェンタニル貼付剤（1日用） mg
  </option>

  <option value="モルヒネ坐剤 mg">
    モルヒネ坐剤 mg
  </option>

  <option value="モルヒネ注射 mg">
    モルヒネ注射 mg
  </option>

  <option value="ヒドロモルフォン注射 mg">
    ヒドロモルフォン注射 mg
  </option>

  <option value="オキシコドン注射 mg">
    オキシコドン注射 mg
  </option>

  <option value="フェンタニル注射 μg">
    フェンタニル注射 μg
  </option>

  <option value="トラマドール内服 mg">
    トラマドール内服 mg
  </option>

  <option value="デュロテップパッチ（3日用） mg">
    デュロテップパッチ（3日用） mg
  </option>

</select>

  </div>

  <button id="calc">
    計算
  </button>

  <div id="error" class="error"></div>

</section>

<section
  id="resultCard"
  class="card result-card"
  style="display:none"
>

  <div class="result-label">
    変更後の量
  </div>

  <div id="resultDrug" class="result-drug"></div>

  <div id="resultValue" class="result-value"></div>

  <div id="consultNote" class="consult-note" style="display:none"></div>

  <div class="result-note">
    ※ 指定された換算比に基づく参考値
  </div>

  <!-- すべての結果に必ず表示する注意コメント -->

  <div id="resultWarning" class="result-warning">
    必ずご自分でも検算してください。<br>
    なお、経口等から持続注射に切り替える場合や、オピオイドの種類が変わる場合などは、ここでの当量換算結果よりすこし少なめの投与量から開始して様子をみてベースアップするなどの慎重な対応をご検討ください。
  </div>

</section>

</main>

<script>

const ratios = [

  ["モルヒネ内服 mg", 1, "mg"],

  ["ヒドロモルフォン内服 mg", 0.2, "mg"],

  ["オキシコドン内服 mg", 2 / 3, "mg"],

  ["フェンタニル貼付剤（1日用） mg", 1 / 30, "mg"],

  ["モルヒネ坐剤 mg", 2 / 3, "mg"],

  ["モルヒネ注射 mg", 0.5, "mg"],

  ["ヒドロモルフォン注射 mg", 0.04, "mg"],

  ["オキシコドン注射 mg", 0.5, "mg"],

  ["フェンタニル注射 μg", 10, "μg"],

  ["トラマドール内服 mg", 5, "mg"],

  ["デュロテップパッチ（3日用） mg", 0.07, "mg"]

];


function formatValue(value, unit) {

  if (unit === "μg") {
    return Math.round(value) + " μg";
  }

  return value.toFixed(2) + " mg";
}


function calculate() {

  const amount =
    Number(document.getElementById("amount").value);

  const fromDrug =
    document.getElementById("fromDrug").value;

  const toDrug =
    document.getElementById("toDrug").value;

  const error =
    document.getElementById("error");

  const resultCard =
    document.getElementById("resultCard");

  const resultDrug =
    document.getElementById("resultDrug");

  const resultValue =
    document.getElementById("resultValue");

  const consultNote =
    document.getElementById("consultNote");

  const resultWarning =
    document.getElementById("resultWarning");


  error.textContent = "";

  resultCard.style.display = "none";

  consultNote.textContent = "";
  consultNote.style.display = "none";

  resultWarning.style.display = "block";


  if (
    document.getElementById("amount").value === "" ||
    !Number.isFinite(amount) ||
    amount < 0
  ) {

    error.textContent =
      "変更前の量を入力してください。";

    return;
  }


  /*
   * トラマドール内服の入力上限
   *
   * 変更前の薬剤としてトラマドールを
   * 直接入力する場合も400 mgを上限とする。
   */

  if (
    fromDrug === "トラマドール内服 mg" &&
    amount > 400
  ) {

    error.textContent =
      "トラマドール内服は400 mgまで入力できます。";

    return;
  }


  const fromRatio =
    ratios.find(r => r[0] === fromDrug);

  const toRatio =
    ratios.find(r => r[0] === toDrug);


  if (!fromRatio || !toRatio) {

    error.textContent =
      "薬剤を選択してください。";

    return;
  }


  let result;
  let resultText = "";


  /*
   * オキシコドン注射 → モルヒネ注射
   *
   * 5 mg → 4～5 mg
   *
   * したがって
   * 1 mg → 0.8～1.0 mg
   */

  if (
    fromDrug === "オキシコドン注射 mg" &&
    toDrug === "モルヒネ注射 mg"
  ) {

    const minResult = amount * 0.8;
    const maxResult = amount;

    resultText =
      minResult.toFixed(2) +
      "～" +
      maxResult.toFixed(2) +
      " mg";
  }


  /*
   * モルヒネ注射 → オキシコドン注射
   *
   * 4 mg → 5 mg
   *
   * したがって
   * 1 mg → 1.0～1.25 mg
   */

  else if (
    fromDrug === "モルヒネ注射 mg" &&
    toDrug === "オキシコドン注射 mg"
  ) {

    const minResult = amount;
    const maxResult = amount * 1.25;

    resultText =
      minResult.toFixed(2) +
      "～" +
      maxResult.toFixed(2) +
      " mg";
  }


  /*
   * ヒドロモルフォン内服 → ヒドロモルフォン注射
   *
   * 5 mg → 1 mg
   */

  else if (
    fromDrug === "ヒドロモルフォン内服 mg" &&
    toDrug === "ヒドロモルフォン注射 mg"
  ) {

    result = amount / 5;
  }


  /*
   * ヒドロモルフォン注射 → ヒドロモルフォン内服
   *
   * 1 mg → 2.5～3.0 mg
   */

  else if (
    fromDrug === "ヒドロモルフォン注射 mg" &&
    toDrug === "ヒドロモルフォン内服 mg"
  ) {

    const minResult = amount * 2.5;
    const maxResult = amount * 3.0;

    resultText =
      minResult.toFixed(2) +
      "～" +
      maxResult.toFixed(2) +
      " mg";
  }


  /*
   * すべての薬剤 → モルヒネ坐剤
   *
   * モルヒネ内服 6 mg
   * → モルヒネ坐剤 4～4.5 mg
   *
   * まず変更前の薬剤をモルヒネ換算し、
   * そのモルヒネ換算量に 6：4～4.5 を適用する。
   */

  else if (
    toDrug === "モルヒネ坐剤 mg"
  ) {

    const morphineEquivalent =
      amount / fromRatio[1];

    const minResult =
      morphineEquivalent * (4 / 6);

    const maxResult =
      morphineEquivalent * (4.5 / 6);

    resultText =
      minResult.toFixed(2) +
      "～" +
      maxResult.toFixed(2) +
      " mg";
  }


  /*
   * モルヒネ坐剤 → 他の薬剤
   *
   * モルヒネ坐剤 4 mg
   * → モルヒネ内服 5.33～6.00 mg
   *
   * 坐剤からモルヒネ換算量へ戻す際は、
   * 4～4.5 mg → 6 mg の逆換算を使用する。
   */

  else if (
    fromDrug === "モルヒネ坐剤 mg"
  ) {

    const minMorphineEquivalent =
      amount * (6 / 4.5);

    const maxMorphineEquivalent =
      amount * (6 / 4);

    const minResult =
      minMorphineEquivalent * toRatio[1];

    const maxResult =
      maxMorphineEquivalent * toRatio[1];

    /*
     * フェンタニル注射は μg 表示なので、
     * 最後に単位を合わせる。
     */

    if (toRatio[2] === "μg") {

      resultText =
        Math.round(minResult) +
        "～" +
        Math.round(maxResult) +
        " μg";

    } else {

      resultText =
        minResult.toFixed(2) +
        "～" +
        maxResult.toFixed(2) +
        " mg";
    }
  }


  /*
   * 同じ薬剤
   */

  else if (fromDrug === toDrug) {

    result = amount;
  }


  /*
   * その他の換算
   */

  else {

    const morphineEquivalent =
      amount / fromRatio[1];

    result =
      morphineEquivalent * toRatio[1];
  }


  /*
   * トラマドール内服の上限400 mgチェック
   *
   * 変更後がトラマドール内服の場合、
   * 通常の換算結果または範囲表示の上限が
   * 400 mgを超えたら警告を表示する。
   */

  if (
    toDrug === "トラマドール内服 mg"
  ) {

    let maximumResult = null;

    if (resultText !== "") {

      /*
       * 「○○～○○ mg」の後半を取得
       */

      const match =
        resultText.match(/～([0-9.]+)\s*mg/);

      if (match) {
        maximumResult = Number(match[1]);
      }

    } else if (Number.isFinite(result)) {

      maximumResult = result;
    }


    if (
      Number.isFinite(maximumResult) &&
      maximumResult > 400
    ) {

      resultDrug.textContent =
        toDrug;

      resultValue.textContent =
        "400 mgを超えるため、他のオピオイドをご検討ください。";

      resultWarning.style.display = "block";

      resultCard.style.display = "block";

      return;
    }
  }


  /*
   * 相談コメント①
   *
   * フェンタニル貼付剤（1日用）6 mg以上から
   * 他のオピオイドへ変更する場合。
   */

  if (
    fromDrug === "フェンタニル貼付剤（1日用） mg" &&
    amount >= 6 &&
    toDrug !== fromDrug
  ) {

    consultNote.textContent =
      "※ フェンタニル貼付剤6 mg以上から他のオピオイドへ変更する場合は、緩和ケア支援チームにご相談ください。";

    consultNote.style.display = "block";
  }


  /*
   * 相談コメント②
   *
   * 高濃度ヒドロモルフォンへの変更。
   */

  if (
    toDrug === "ヒドロモルフォン注射 mg" &&
    fromDrug !== toDrug
  ) {

    consultNote.textContent =
      "※ 高濃度ヒドロモルフォン注射(20mg/2mL)への変更については、緩和ケア支援チームにご相談ください。";

    consultNote.style.display = "block";
  }


  /*
   * 相談コメント③
   *
   * ヒドロモルフォン注射
   * → ヒドロモルフォン内服
   */

  if (
    fromDrug === "ヒドロモルフォン注射 mg" &&
    toDrug === "ヒドロモルフォン内服 mg"
  ) {

    consultNote.textContent =
      "※ ヒドロモルフォン注射から内服への変更については、緩和ケア支援チームにご相談ください。";

    consultNote.style.display = "block";
  }


  resultDrug.textContent =
    toDrug;


  if (resultText !== "") {

    resultValue.textContent =
      resultText;

  } else {

    resultValue.textContent =
      formatValue(result, toRatio[2]);
  }


  /*
   * すべての結果に注意コメントを表示
   */

  resultWarning.textContent =
    "必ずご自分でも検算してください。" +
    "\n" +
    "なお、経口等から持続注射に切り替える場合や、オピオイドの種類が変わる場合などは、ここでの当量換算結果よりすこし少なめの投与量から開始して様子をみてベースアップするなどの慎重な対応をご検討ください。";

  resultWarning.style.whiteSpace = "pre-line";
  resultWarning.style.display = "block";


  resultCard.style.display = "block";
}


document
  .getElementById("calc")
  .addEventListener("click", calculate);


/*
 * Service Worker
 */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js")
      .catch(error => {

        console.error(
          "Service Worker registration failed:",
          error
        );

      });

  });

}

</script>

</body>
</html>
